<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MiddleGrade" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="MiddleGrade — средний балл, зачётка, расписание и задания из Journal для студентов IT Top College."
    />
    <title>MiddleGrade — успеваемость</title>
    <script>
      (function () {
        var key = "mg-theme";
        var stored;
        try {
          stored = localStorage.getItem(key);
        } catch (error) {
          stored = null;
        }
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "light" ? "#e8eaf0" : "#080a12");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div
        style="
          margin: 8vh auto 0;
          width: min(60vw, 40rem);
          padding: 2.5rem;
          border-radius: 1.5rem;
          background: #1a1e30;
          color: #eceef6;
          font-family: system-ui, sans-serif;
          font-weight: 600;
          text-align: center;
        "
      >
        MiddleGrade — приложение на React, поэтому в браузере должен быть включён
        JavaScript.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
